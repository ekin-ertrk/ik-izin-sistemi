<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İK Özel İzin Takip Paneli - Veritabanı Bağlantılı</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Supabase Bağlantısı
        const supabaseUrl = 'https://rgscapgpdiybytlzbbkb.supabase.co';
        const supabaseKey = 'sb_publishable_idM-Y-RSFKPpQ7RtekBzNw_fppVcucc';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const RESMI_TATILLER = [
            '2026-01-01', '2026-04-23', '2026-05-01', '2026-05-19', '2026-07-15', '2026-08-30', '2026-10-29',
            '2026-03-20', '2026-03-21', '2026-03-22', '2026-05-27', '2026-05-28', '2026-05-29', '2026-05-30'
        ];

        const isGunuHesapla = (baslangicStr, bitisStr) => {
            if (!baslangicStr || !bitisStr) return 0;
            let baslangic = new Date(baslangicStr);
            let bitis = new Date(bitisStr);
            if (baslangic > bitis) return 0;
            let isGunu = 0;
            let current = new Date(baslangic);
            while (current <= bitis) {
                let day = current.getDay();
                let dateStr = current.toISOString().split('T')[0];
                if (day !== 0 && day !== 6 && !RESMI_TATILLER.includes(dateStr)) {
                    isGunu++;
                }
                current.setDate(current.getDate() + 1);
            }
            return isGunu;
        };

        const yasHesapla = (dogumTarihiStr) => {
            if(!dogumTarihiStr) return 30;
            const today = new Date();
            const birthDate = new Date(dogumTarihiStr);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        };

        const kidemYiliHesapla = (iseBaslamaStr) => {
            if(!iseBaslamaStr) return 0;
            const today = new Date();
            const startDate = new Date(iseBaslamaStr);
            let diff = (today - startDate) / (1000 * 60 * 60 * 24 * 365.25);
            return Math.floor(diff);
        };

        const yillikIzinHakkiHesapla = (iseBaslamaStr, dogumTarihiStr) => {
            const kidem = kidemYiliHesapla(iseBaslamaStr);
            const yas = yasHesapla(dogumTarihiStr);
            if (kidem < 1) return 0;
            let toplamHak = 0;
            for (let i = 1; i <= kidem; i++) {
                let yillikHak = 14;
                if (i >= 5 && i < 15) yillikHak = 20;
                if (i >= 15) yillikHak = 26;
                if (yas <= 18 || yas >= 50) yillikHak = Math.max(yillikHak, 20);
                toplamHak += yillikHak;
            }
            return toplamHak;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('ozet');
            const [personeller, setPersoneller] = useState([]);
            const [talepler, setTalepler] = useState([]);
            const [aramaMetni, setAramaMetni] = useState('');

            // Personel Ekleme State'leri
            const [yeniAd, setYeniAd] = useState('');
            const [yeniDepartman, setYeniDepartman] = useState('');
            const [yeniIseBaslama, setYeniIseBaslama] = useState('');
            const [yeniDogumTarihi, setYeniDogumTarihi] = useState('');

            // İzin Ekleme State'leri
            const [talepPersonelId, setTalepPersonelId] = useState('');
            const [talepBaslangic, setTalepBaslangic] = useState('');
            const [talepBitis, setTalepBitis] = useState('');

            useEffect(() => {
                const veriGetir = async () => {
                    const { data: pData } = await supabase.from('personeller').select('*');
                    if (pData) setPersoneller(pData);
                    const { data: tData } = await supabase.from('talepler').select('*');
                    if (tData) setTalepler(tData);
                };
                veriGetir();
            }, []);

            const personelEkle = async (e) => {
                e.preventDefault();
                try {
                    const { data, error } = await supabase
                        .from('personeller')
                        .insert([{ ad: yeniAd, departman: yeniDepartman, ise_baslama: yeniIseBaslama, dogum_tarihi: yeniDogumTarihi }])
                        .select();
                    
                    if (error) {
                        alert("Veritabanı Hatası: " + error.message);
                        console.error("Detaylı Hata:", error);
                    } else if (data) {
                        setPersoneller([...personeller, data[0]]);
                        setYeniAd(''); setYeniDepartman(''); setYeniIseBaslama(''); setYeniDogumTarihi('');
                        alert("Personel başarıyla eklendi!");
                    }
                } catch (err) {
                    alert("Bağlantı Hatası: " + err.message);
                }
            };

            const personelSil = async (id) => {
                const { error } = await supabase.from('personeller').delete().eq('id', id);
                if (!error) setPersoneller(personeller.filter(p => p.id !== id));
            };

            const talepEkle = async (e) => {
                e.preventDefault();
                try {
                    const { data, error } = await supabase
                        .from('talepler')
                        .insert([{ personel_id: talepPersonelId, baslangic: talepBaslangic, bitis: talepBitis, durum: 'onaylandi' }])
                        .select();
                        
                    if (error) {
                        alert("İzin Eklerken Hata Oluştu: " + error.message);
                    } else if (data) {
                        setTalepler([...talepler, data[0]]);
                        setTalepPersonelId(''); setTalepBaslangic(''); setTalepBitis('');
                        alert("İzin başarıyla eklendi!");
                    }
                } catch (err) {
                    alert("Bağlantı Hatası: " + err.message);
                }
            };

            const talepGuncelle = async (id, yeniDurum) => {
                const { error } = await supabase.from('talepler').update({ durum: yeniDurum }).eq('id', id);
                if (!error) {
                    setTalepler(talepler.map(t => t.id === id ? {...t, durum: yeniDurum} : t));
                }
            };

            const personelDurumlari = useMemo(() => {
                return personeller.map(p => {
                    const hakEdilen = yillikIzinHakkiHesapla(p.ise_baslama, p.dogum_tarihi);
                    const kidem = kidemYiliHesapla(p.ise_baslama);
                    const kullanilanTalepler = talepler.filter(t => t.personel_id === p.id && t.durum === 'onaylandi');
                    const kullanilanGun = kullanilanTalepler.reduce((toplam, t) => toplam + isGunuHesapla(t.baslangic, t.bitis), 0);
                    const bekleyenTalepler = talepler.filter(t => t.personel_id === p.id && t.durum === 'bekliyor');
                    const bekleyenGun = bekleyenTalepler.reduce((toplam, t) => toplam + isGunuHesapla(t.baslangic, t.bitis), 0);
                    return { ...p, hakEdilen, kullanilanGun, kalan: hakEdilen - kullanilanGun, bekleyenGun, kidem };
                });
            }, [personeller, talepler]);

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-64 bg-white shadow-xl flex flex-col z-10">
                        <div className="p-6 border-b border-slate-100">
                            <h1 className="text-xl font-bold text-blue-600"><i className="fas fa-leaf mr-2"></i>İK İzin Takip</h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveTab('ozet')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${activeTab==='ozet' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fas fa-chart-pie w-6"></i> Bakiye ve Özet
                            </button>
                            <button onClick={() => setActiveTab('personel')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${activeTab==='personel' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fas fa-users w-6"></i> Personel Listesi
                            </button>
                            <button onClick={() => setActiveTab('talepler')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${activeTab==='talepler' ? 'bg-blue-50 text-blue-600 font-medium' : 'text-slate-600 hover:bg-slate-50'}`}>
                                <i className="fas fa-calendar-check w-6"></i> İzin İşlemleri
                            </button>
                        </nav>
                    </div>

                    <div className="flex-1 overflow-auto p-8">
                        
                        {activeTab === 'ozet' && (
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 mb-6">İK Kontrol Paneli</h2>
                                <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                        <h3 className="font-semibold text-slate-700">İzin Bakiye Durumları</h3>
                                        <input type="text" placeholder="İsim veya departman ara..." className="pl-4 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value={aramaMetni} onChange={(e) => setAramaMetni(e.target.value)} />
                                    </div>
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-white text-slate-500 text-sm border-b">
                                                <th className="p-4 font-medium">Personel</th>
                                                <th className="p-4 font-medium">Departman</th>
                                                <th className="p-4 font-medium">Kıdem</th>
                                                <th className="p-4 font-medium">Toplam Hak</th>
                                                <th className="p-4 font-medium">Kalan İzin</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {personelDurumlari.filter(p => p.ad.toLowerCase().includes(aramaMetni.toLowerCase()) || p.departman.toLowerCase().includes(aramaMetni.toLowerCase())).map(p => (
                                                <tr key={p.id} className="border-b border-slate-50 hover:bg-slate-50">
                                                    <td className="p-4 font-medium text-slate-800">{p.ad}</td>
                                                    <td className="p-4 text-slate-600">{p.departman}</td>
                                                    <td className="p-4 text-slate-600">{p.kidem} Yıl</td>
                                                    <td className="p-4 text-slate-600">{p.hakEdilen} Gün</td>
                                                    <td className="p-4 font-bold">{p.kalan} Gün</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'personel' && (
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 mb-6">Personel Yönetimi</h2>
                                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 mb-6">
                                    <form className="flex gap-4 items-end" onSubmit={personelEkle}>
                                        <div className="flex-1">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Ad Soyad</label>
                                            <input required value={yeniAd} onChange={e=>setYeniAd(e.target.value)} type="text" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Departman</label>
                                            <input required value={yeniDepartman} onChange={e=>setYeniDepartman(e.target.value)} type="text" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">İşe Başlama</label>
                                            <input required value={yeniIseBaslama} onChange={e=>setYeniIseBaslama(e.target.value)} type="date" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Doğum Tarihi</label>
                                            <input required value={yeniDogumTarihi} onChange={e=>setYeniDogumTarihi(e.target.value)} type="date" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Ekle</button>
                                    </form>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-50 text-slate-500 text-sm border-b">
                                                <th className="p-4 font-medium">Ad Soyad</th>
                                                <th className="p-4 font-medium">Departman</th>
                                                <th className="p-4 font-medium">İşe Başlama</th>
                                                <th className="p-4 font-medium">Doğum Tarihi</th>
                                                <th className="p-4 font-medium text-right">İşlem</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {personeller.map(p => (
                                                <tr key={p.id} className="border-b border-slate-50 hover:bg-slate-50">
                                                    <td className="p-4 font-medium text-slate-800">{p.ad}</td>
                                                    <td className="p-4 text-slate-600">{p.departman}</td>
                                                    <td className="p-4 text-slate-600">{p.ise_baslama}</td>
                                                    <td className="p-4 text-slate-600">{p.dogum_tarihi}</td>
                                                    <td className="p-4 text-right">
                                                        <button onClick={() => personelSil(p.id)} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'talepler' && (
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 mb-6">İzin İşlemleri & Onaylar</h2>
                                <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 mb-8">
                                    <h3 className="font-semibold text-slate-800 mb-4 border-b pb-2">Yeni İzin Kaydı Oluştur</h3>
                                    <form className="flex flex-wrap gap-4 items-end" onSubmit={talepEkle}>
                                        <div className="w-1/4 min-w-[200px]">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Personel Seç</label>
                                            <select required value={talepPersonelId} onChange={e=>setTalepPersonelId(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm bg-slate-50 focus:bg-white">
                                                <option value="">Seçiniz...</option>
                                                {personelDurumlari.map(p => (
                                                    <option key={p.id} value={p.id}>{p.ad} (Kalan: {p.kalan} Gün)</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="flex-1 min-w-[150px]">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Başlangıç</label>
                                            <input required value={talepBaslangic} onChange={e=>setTalepBaslangic(e.target.value)} type="date" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <div className="flex-1 min-w-[150px]">
                                            <label className="block text-xs font-medium text-slate-500 mb-1">Bitiş</label>
                                            <input required value={talepBitis} onChange={e=>setTalepBitis(e.target.value)} type="date" className="w-full border rounded-lg px-3 py-2 text-sm" />
                                        </div>
                                        <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium">Kaydet</button>
                                    </form>
                                </div>

                                <div className="space-y-4">
                                    {talepler.map(talep => {
                                        const per = personelDurumlari.find(p => p.id === parseInt(talep.personel_id));
                                        if(!per) return null;
                                        const sure = isGunuHesapla(talep.baslangic, talep.bitis);
                                        return (
                                            <div key={talep.id} className="bg-white rounded-xl shadow-sm border p-5 flex items-center justify-between border-slate-100">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-3 mb-1">
                                                        <span className="font-bold text-lg text-slate-800">{per.ad}</span>
                                                        <span className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded">{per.departman}</span>
                                                        <span className={`text-xs px-2 py-1 rounded-full font-medium ${talep.durum === 'onaylandi' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                                            {talep.durum}
                                                        </span>
                                                    </div>
                                                    <div className="text-sm text-slate-600 flex items-center gap-4">
                                                        <span><i className="far fa-calendar-alt mr-1"></i> {talep.baslangic} <i className="fas fa-arrow-right text-xs mx-1"></i> {talep.bitis}</span>
                                                        <span className="font-medium text-slate-800"><i className="fas fa-clock mr-1 text-slate-400"></i> {sure} İş Günü</span>
                                                    </div>
                                                </div>
                                                {talep.durum !== 'reddedildi' && (
                                                    <button onClick={() => talepGuncelle(talep.id, 'reddedildi')} className="bg-red-50 text-red-600 px-4 py-2 rounded-lg border border-red-200">
                                                        İptal Et
                                                    </button>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const supabaseUrl = 'https://rgscapgpdiybytlzbbkb.supabase.co';
        const supabaseKey = 'sb_publishable_idM-Y-RSFKPpQ7RtekBzNw_fppVcucc';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const IZIN_TURLERI = [
            { ad: 'Yıllık İzin',    duser: true,  renk: 'rose',   not: 'Bakiyeden düşer.', hex: '#fb7185' },
            { ad: 'Avans İzin',     duser: true,  renk: 'purple', not: 'Bakiyeden düşer; 1 yılı dolmayan personel de kullanabilir.', hex: '#c084fc' },
            { ad: 'Ücretsiz İzin',  duser: false, renk: 'stone',  not: 'Bakiyeden düşmez.', hex: '#a8a29e' },
            { ad: 'Mazeret İzni',   duser: false, renk: 'orange', not: 'Bakiyeden düşmez.', hex: '#fb923c' },
            { ad: 'Hastalık/Rapor', duser: false, renk: 'teal',   not: 'Bakiyeden düşmez.', hex: '#2dd4bf' }
        ];
        const turBilgi = (ad) => IZIN_TURLERI.find(t => t.ad === ad) || IZIN_TURLERI[0];
        const BAKIYEDEN_DUSER = new Set(IZIN_TURLERI.filter(t => t.duser).map(t => t.ad));

        const RESMI_TATILLER = new Set([
            '2026-01-01', '2026-04-23', '2026-05-01', '2026-05-19', '2026-07-15', '2026-08-30', '2026-10-29',
            '2026-03-20', '2026-03-21', '2026-03-22', '2026-05-27', '2026-05-28', '2026-05-29', '2026-05-30',
            '2027-01-01', '2027-04-23', '2027-05-01', '2027-05-19', '2027-07-15', '2027-08-30', '2027-10-29'
        ]);

        const parseISO = (iso) => {
            if (!iso) return null;
            const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d);
        };
        const toISO = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const trTarih = (iso) => { const d = parseISO(iso); return d ? d.toLocaleDateString('tr-TR') : '—'; };

        const tamYil = (iso, ref = new Date()) => {
            const f = parseISO(iso);
            if (!f) return null;
            let y = ref.getFullYear() - f.getFullYear();
            const m = ref.getMonth() - f.getMonth();
            if (m < 0 || (m === 0 && ref.getDate() < f.getDate())) y--;
            return y;
        };
        const izinYili = (iso, ref = new Date()) => {
            const f = parseISO(iso);
            if (!f) return null;
            let bas = new Date(ref.getFullYear(), f.getMonth(), f.getDate());
            if (bas > ref) bas = new Date(ref.getFullYear() - 1, f.getMonth(), f.getDate());
            const bit = new Date(bas.getFullYear() + 1, bas.getMonth(), bas.getDate());
            bit.setDate(bit.getDate() - 1);
            return { bas, bit };
        };
        const yillikIzinHakki = (kidem, minYirmi) => {
            if (kidem == null || kidem < 1) return 0;
            let gun = kidem <= 5 ? 14 : (kidem < 15 ? 20 : 26);
            if (minYirmi) gun = Math.max(gun, 20);
            return gun;
        };
        const isGunuHesapla = (bas, bit) => {
            const s = parseISO(bas), e = parseISO(bit);
            if (!s || !e || e < s) return 0;
            let n = 0;
            const cur = new Date(s);
            while (cur <= e) {
                const g = cur.getDay();
                if (g !== 0 && g !== 6 && !RESMI_TATILLER.has(toISO(cur))) n++;
                cur.setDate(cur.getDate() + 1);
            }
            return n;
        };
        const araliktaMi = (iso, bas, bit) => { const d = parseISO(iso); return d && d >= bas && d <= bit; };

        const TONLAR = { 
            emerald: 'bg-emerald-100 text-emerald-700', 
            amber: 'bg-amber-100 text-amber-700', 
            red: 'bg-red-100 text-red-700', 
            stone: 'bg-stone-100 text-stone-600', 
            rose: 'bg-rose-100 text-rose-700', 
            purple: 'bg-purple-100 text-purple-700',
            orange: 'bg-orange-100 text-orange-700',
            teal: 'bg-teal-100 text-teal-700'
        };
        const Rozet = ({ children, ton }) => <span className={`text-xs px-3 py-1.5 rounded-full font-bold shadow-sm ${TONLAR[ton] || TONLAR.stone}`}>{children}</span>;
        
        const inputCls = "w-full border border-stone-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400 bg-white transition-shadow shadow-sm";
        const Etiket = ({ children }) => <label className="block text-xs font-bold text-stone-500 mb-1.5 ml-1 tracking-wide">{children}</label>;

        const HalkaGrafik = ({ toplamHak, yillik, avans, diger }) => {
            const toplamKapasite = Math.max(toplamHak, yillik + avans); 
            const kalan = Math.max(0, toplamHak - (yillik + avans));
            
            const dilimler = [
                { deger: kalan, renk: '#34d399' }, 
                { deger: yillik, renk: '#fb7185' }, 
                { deger: avans, renk: '#c084fc' },  
                { deger: diger, renk: '#fbbf24' }   
            ];

            const cevre = 100; 
            let birikimli = 0;
            const toplamGosterim = Math.max(toplamKapasite + diger, 1);

            return (
                <div className="relative w-16 h-16 drop-shadow-md">
                    <svg viewBox="-4 -4 44 44" className="w-16 h-16 transform -rotate-90 halka-grafik">
                        <circle cx="18" cy="18" r="15.915" fill="transparent" stroke="#f5f5f4" strokeWidth="6" />
                        {dilimler.map((d, i) => {
                            if(d.deger <= 0) return null;
                            const yuzde = (d.deger / toplamGosterim) * cevre;
                            const offset = -birikimli;
                            birikimli += yuzde;
                            return (
                                <circle key={i} cx="18" cy="18" r="15.915" fill="transparent"
                                    stroke={d.renk} strokeWidth="6" strokeLinecap="round"
                                    strokeDasharray={`${yuzde} ${cevre - yuzde}`}
                                    strokeDashoffset={offset} />
                            );
                        })}
                    </svg>
                </div>
            );
        };

        const PersonelDuzenlePenceresi = ({ personel, onKaydet, onKapat }) => {
            const [ad, setAd] = useState(personel.ad || '');
            const [departman, setDepartman] = useState(personel.departman || '');
            const [iseBaslama, setIseBaslama] = useState((personel.ise_baslama || '').slice(0, 10));
            const [devreden, setDevreden] = useState(String(personel.devreden == null ? 0 : personel.devreden));
            const [minYirmi, setMinYirmi] = useState(!!personel.min_yirmi);
            const [kaydediliyor, setKaydediliyor] = useState(false);

            const kaydet = async (e) => {
                e.preventDefault();
                setKaydediliyor(true);
                await onKaydet(personel.id, {
                    ad: ad.trim(), departman: departman.trim(),
                    ise_baslama: iseBaslama, devreden: Number(devreden) || 0,
                    min_yirmi: minYirmi
                });
                setKaydediliyor(false);
            };

            return (
                <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onKapat}>
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-5 border-b border-stone-100 pb-3">
                            <h3 className="text-lg font-bold text-stone-800 flex items-center"><i className="fas fa-user-pen text-rose-400 mr-2"></i> Bakiye & Bilgi Düzenle</h3>
                            <button onClick={onKapat} className="text-stone-400 hover:text-rose-500 transition-colors"><i className="fas fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={kaydet} className="space-y-4">
                            <div><Etiket>Ad Soyad *</Etiket><input required value={ad} onChange={e => setAd(e.target.value)} className={inputCls} /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><Etiket>Departman</Etiket><input value={departman} onChange={e => setDepartman(e.target.value)} className={inputCls} /></div>
                                <div><Etiket>İşe Başlama *</Etiket><input required type="date" value={iseBaslama} onChange={e => setIseBaslama(e.target.value)} className={inputCls} /></div>
                            </div>
                            <div className="bg-stone-50 p-4 rounded-xl border border-stone-100">
                                <Etiket>Önceki Yıllardan Devreden Toplam İzin (Gün)</Etiket>
                                <input type="number" value={devreden} onChange={e => setDevreden(e.target.value)} className={inputCls} />
                                <p className="text-[11px] text-stone-500 mt-2 leading-relaxed">Personelin geçmiş tüm yıllardan birikmiş, kullanmadığı toplam izin hakkını giriniz. (Borcu varsa eksi değer girebilirsiniz, örn: -2).</p>
                            </div>
                            <label className="flex items-start gap-3 cursor-pointer bg-stone-50 p-4 rounded-xl border border-stone-100">
                                <input type="checkbox" checked={minYirmi} onChange={e => setMinYirmi(e.target.checked)} className="mt-1 accent-rose-500 w-4 h-4" />
                                <span className="text-sm text-stone-700 font-medium">
                                    En az 20 gün izin hakkı
                                    <span className="block text-xs text-stone-500 font-normal mt-0.5">18 yaş ve altı veya 50 yaş ve üzeri için işaretleyin.</span>
                                </span>
                            </label>
                            <div className="flex justify-end gap-3 pt-4 mt-2">
                                <button type="button" onClick={onKapat} className="px-5 py-2.5 rounded-xl text-sm border border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-colors">Vazgeç</button>
                                <button type="submit" disabled={kaydediliyor} className="bg-gradient-to-r from-rose-500 to-orange-400 text-white px-6 py-2.5 rounded-xl text-sm hover:opacity-90 disabled:opacity-50 font-bold shadow-md transition-all">
                                    {kaydediliyor ? 'Kaydediliyor…' : 'Kaydet'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const TalepDuzenlePenceresi = ({ talep, onKaydet, onKapat }) => {
            const [tur, setTur] = useState(talep.tur || 'Yıllık İzin');
            const [baslangic, setBaslangic] = useState((talep.baslangic || '').slice(0, 10));
            const [bitis, setBitis] = useState((talep.bitis || '').slice(0, 10));
            const [iseDonus, setIseDonus] = useState((talep.ise_donus_tarihi || '').slice(0, 10));
            const [telefon, setTelefon] = useState(talep.telefon || '');
            const [adres, setAdres] = useState(talep.adres || '');
            const [aciklama, setAciklama] = useState(talep.aciklama || '');
            const [kaydediliyor, setKaydediliyor] = useState(false);

            const kaydet = async (e) => {
                e.preventDefault();
                setKaydediliyor(true);
                await onKaydet(talep.id, {
                    tur, baslangic, bitis,
                    ise_donus_tarihi: iseDonus || null,
                    telefon: telefon.trim(),
                    adres: adres.trim(),
                    aciklama: aciklama.trim()
                });
                setKaydediliyor(false);
            };

            return (
                <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4" onClick={onKapat}>
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg p-6" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-5 border-b border-stone-100 pb-3">
                            <h3 className="text-lg font-bold text-stone-800 flex items-center"><i className="fas fa-file-signature text-rose-400 mr-2"></i>İzin Kaydını Düzenle</h3>
                            <button onClick={onKapat} className="text-stone-400 hover:text-rose-500 transition-colors"><i className="fas fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={kaydet} className="space-y-4">
                            <div><Etiket>İzin Türü</Etiket>
                                <select value={tur} onChange={e => setTur(e.target.value)} className={inputCls}>
                                    {IZIN_TURLERI.map(t => <option key={t.ad} value={t.ad}>{t.ad}</option>)}
                                </select>
                            </div>
                            <div className="grid grid-cols-3 gap-4">
                                <div><Etiket>Başlangıç</Etiket><input required type="date" value={baslangic} onChange={e => setBaslangic(e.target.value)} className={inputCls} /></div>
                                <div><Etiket>Bitiş</Etiket><input required type="date" value={bitis} onChange={e => setBitis(e.target.value)} className={inputCls} /></div>
                                <div><Etiket>İşe Dönüş</Etiket><input required type="date" value={iseDonus} onChange={e => setIseDonus(e.target.value)} className={inputCls} /></div>
                            </div>
                            <div><Etiket>İletişim Numarası</Etiket><input type="tel" value={telefon} onChange={e => setTelefon(e.target.value)} className={inputCls} /></div>
                            <div><Etiket>İzinde Bulunacağı Adres</Etiket><textarea rows="2" value={adres} onChange={e => setAdres(e.target.value)} className={inputCls}></textarea></div>
                            <div><Etiket>Açıklama</Etiket><textarea rows="2" value={aciklama} onChange={e => setAciklama(e.target.value)} className={inputCls}></textarea></div>
                            
                            <div className="flex justify-end gap-3 pt-4 mt-2 border-t border-stone-100">
                                <button type="button" onClick={onKapat} className="px-5 py-2.5 rounded-xl text-sm border border-stone-200 text-stone-600 hover:bg-stone-50 font-bold transition-colors">Vazgeç</button>
                                <button type="submit" disabled={kaydediliyor} className="bg-gradient-to-r from-rose-500 to-orange-400 text-white px-6 py-2.5 rounded-xl text-sm hover:opacity-90 disabled:opacity-50 font-bold shadow-md transition-all">
                                    {kaydediliyor ? 'Kaydediliyor…' : 'Güncelle'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const App = ({ onLogout }) => {
            const [activeTab, setActiveTab] = useState('ozet');
            const [personeller, setPersoneller] = useState([]);
            const [talepler, setTalepler] = useState([]);
            const [aramaMetni, setAramaMetni] = useState('');
            const [durumFiltre, setDurumFiltre] = useState('hepsi');
            const [yukleniyor, setYukleniyor] = useState(true);
            const [hataMesaji, setHataMesaji] = useState('');
            
            const [duzenlenenTalep, setDuzenlenenTalep] = useState(null);
            const [duzenlenenPersonel, setDuzenlenenPersonel] = useState(null);
            const fileInputRef = useRef(null);

            const [yeniAd, setYeniAd] = useState('');
            const [yeniDepartman, setYeniDepartman] = useState('');
            const [yeniIseBaslama, setYeniIseBaslama] = useState('');
            const [yeniDevreden, setYeniDevreden] = useState('0');
            const [yeniMinYirmi, setYeniMinYirmi] = useState(false);

            const [talepPersonelId, setTalepPersonelId] = useState('');
            const [talepTur, setTalepTur] = useState('Yıllık İzin');
            const [talepBaslangic, setTalepBaslangic] = useState('');
            const [talepBitis, setTalepBitis] = useState('');
            const [talepIseDonus, setTalepIseDonus] = useState('');
            const [talepTelefon, setTalepTelefon] = useState('');
            const [talepAdres, setTalepAdres] = useState('');
            const [talepAciklama, setTalepAciklama] = useState('');

            useEffect(() => {
                (async () => {
                    const { data: pData, error: pErr } = await supabase.from('personeller').select('*').order('ad');
                    const { data: tData, error: tErr } = await supabase.from('talepler').select('*').order('baslangic', { ascending: false });
                    if (pErr || tErr) setHataMesaji((pErr || tErr).message);
                    if (pData) setPersoneller(pData);
                    if (tData) setTalepler(tData);
                    setYukleniyor(false);
                })();
            }, []);

            const personelDurumlari = useMemo(() => {
                return personeller.map(p => {
                    const kidem = tamYil(p.ise_baslama);
                    const yil = izinYili(p.ise_baslama);
                    const hakEdilen = yillikIzinHakki(kidem, p.min_yirmi);
                    const devreden = Number(p.devreden) || 0;
                    const toplamHak = hakEdilen + devreden;

                    const buYil = talepler.filter(t => String(t.personel_id) === String(p.id) && yil && araliktaMi(t.baslangic, yil.bas, yil.bit));
                    const onayli = buYil.filter(t => t.durum === 'onaylandi');
                    
                    const kullanilanYillik = onayli.filter(t => t.tur === 'Yıllık İzin').reduce((s, t) => s + isGunuHesapla(t.baslangic, t.bitis), 0);
                    const avansGun = onayli.filter(t => t.tur === 'Avans İzin').reduce((s, t) => s + isGunuHesapla(t.baslangic, t.bitis), 0);
                    const dusmeyenGun = onayli.filter(t => !BAKIYEDEN_DUSER.has(t.tur || 'Yıllık İzin')).reduce((s, t) => s + isGunuHesapla(t.baslangic, t.bitis), 0);
                    
                    const kullanilanGun = kullanilanYillik + avansGun;
                    const bekleyenGun = buYil.filter(t => t.durum === 'bekliyor' && BAKIYEDEN_DUSER.has(t.tur || 'Yıllık İzin'))
                        .reduce((s, t) => s + isGunuHesapla(t.baslangic, t.bitis), 0);

                    return { ...p, kidem, hakEdilen, devreden, toplamHak, kullanilanYillik, avansGun, bekleyenGun, dusmeyenGun, kullanilanGun, kalan: toplamHak - kullanilanGun, yilBas: yil ? toISO(yil.bas) : null, yilBit: yil ? toISO(yil.bit) : null };
                });
            }, [personeller, talepler]);

            const perFor = (id) => personelDurumlari.find(p => String(p.id) === String(id));
            const seciliPer = perFor(talepPersonelId);
            const talepGun = isGunuHesapla(talepBaslangic, talepBitis);

            const personelEkle = async (e) => {
                e.preventDefault();
                const { data, error } = await supabase.from('personeller').insert([{
                    ad: yeniAd.trim(), departman: yeniDepartman.trim(),
                    ise_baslama: yeniIseBaslama, devreden: Number(yeniDevreden) || 0,
                    min_yirmi: yeniMinYirmi
                }]).select();
                if (error) return setHataMesaji('Personel eklenemedi: ' + error.message);
                setPersoneller([...personeller, data[0]].sort((a, b) => (a.ad || '').localeCompare(b.ad || '', 'tr')));
                setYeniAd(''); setYeniDepartman(''); setYeniIseBaslama(''); setYeniDevreden('0'); setYeniMinYirmi(false);
                setHataMesaji('');
            };

            const excelYukle = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setYukleniyor(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary', cellDates: true });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws, { raw: false, dateNF: 'yyyy-mm-dd' });
                        
                        const eklenecekler = data.map(row => ({
                            ad: row['Ad Soyad'] || row['Ad'] || '',
                            departman: row['Departman'] || '',
                            ise_baslama: row['İşe Başlama'] || new Date().toISOString().slice(0,10),
                            devreden: Number(row['Devreden']) || 0,
                            min_yirmi: false
                        })).filter(p => p.ad.trim() !== '');

                        if (eklenecekler.length === 0) {
                            setHataMesaji('Excel dosyasında geçerli veri bulunamadı.');
                            setYukleniyor(false);
                            return;
                        }

                        const { data: inserted, error } = await supabase.from('personeller').insert(eklenecekler).select();
                        if (error) throw error;
                        
                        setPersoneller([...personeller, ...inserted].sort((a, b) => (a.ad || '').localeCompare(b.ad || '', 'tr')));
                        alert(`${inserted.length} personel eklendi!`);
                    } catch (err) {
                        setHataMesaji('Excel yüklenirken hata oluştu: ' + err.message);
                    } finally {
                        setYukleniyor(false);
                        e.target.value = ''; 
                    }
                };
                reader.readAsBinaryString(file);
            };

            const personelGuncelle = async (id, alanlar) => {
                const { error } = await supabase.from('personeller').update(alanlar).eq('id', id);
                if (error) { setHataMesaji('Güncellenemedi: ' + error.message); return; }
                setPersoneller(personeller.map(p => p.id === id ? { ...p, ...alanlar } : p).sort((a, b) => (a.ad || '').localeCompare(b.ad || '', 'tr')));
                setDuzenlenenPersonel(null);
                setHataMesaji('');
            };

            const personelSil = async (id, ad) => {
                if (!window.confirm(`${ad} ve tüm izin kayıtları silinecek. Emin misiniz?`)) return;
                const { error } = await supabase.from('personeller').delete().eq('id', id);
                if (error) return setHataMesaji('Silinemedi: ' + error.message);
                setPersoneller(personeller.filter(p => p.id !== id));
                setTalepler(talepler.filter(t => String(t.personel_id) !== String(id)));
            };

                                                        <div className="flex items-center"><div className="w-8 h-8 rounded-lg bg-white flex items-center justify-center shadow-sm border border-stone-100 mr-3"><i className="fas fa-phone text-emerald-400"></i></div> <span className="font-medium">{talep.telefon || <span className="italic text-stone-400">Telefon yok</span>}</span></div>
                                                        <div className="flex items-start"><div className="w-8 h-8 rounded-lg bg-white flex items-center justify-center shadow-sm border border-stone-100 mr-3 mt-0.5 shrink-0"><i className="fas fa-location-dot text-sky-400"></i></div> <span className="flex-1 leading-relaxed font-medium mt-1">{talep.adres || <span className="italic text-stone-400">Adres girilmemiş</span>}</span></div>
                                                        {talep.aciklama && <div className="flex items-start"><div className="w-8 h-8 rounded-lg bg-white flex items-center justify-center shadow-sm border border-stone-100 mr-3 mt-0.5 shrink-0"><i className="fas fa-comment-dots text-amber-400"></i></div> <span className="flex-1 italic leading-relaxed text-stone-500 mt-1">"{talep.aciklama}"</span></div>}
                                                    </div>
                                                </div>

                                                <div className="mt-6 pt-5 flex gap-3">
                                                    {talep.durum === 'bekliyor' && (
                                                        <React.Fragment>
                                                            <button onClick={() => talepGuncelle(talep.id, { durum: 'onaylandi' })} className="bg-emerald-500 text-white px-7 py-2.5 rounded-xl text-sm hover:bg-emerald-600 font-extrabold shadow-md transition-all transform hover:-translate-y-0.5 flex items-center"><i className="fas fa-check mr-2"></i>Onayla</button>
                                                            <button onClick={() => talepGuncelle(talep.id, { durum: 'reddedildi' })} className="bg-white text-red-500 px-7 py-2.5 rounded-xl text-sm border border-red-200 hover:bg-red-50 font-extrabold shadow-sm transition-all"><i className="fas fa-times mr-2"></i>Reddet</button>
                                                        </React.Fragment>
                                                    )}
                                                    {talep.durum !== 'bekliyor' && (
                                                        <button onClick={() => talepGuncelle(talep.id, { durum: 'bekliyor' })} className="text-stone-500 px-6 py-2.5 rounded-xl text-sm border border-stone-200 hover:bg-stone-50 font-bold transition-all shadow-sm"><i className="fas fa-undo mr-2"></i>Geri Al (Bekliyor)</button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {filtreliTalepler.length === 0 && (
                                        <div className="bg-white rounded-2xl border-2 border-dashed border-stone-200 p-12 flex flex-col items-center justify-center text-stone-400">
                                            <div className="w-16 h-16 bg-stone-50 rounded-full flex items-center justify-center mb-4 text-2xl text-stone-300"><i className="fas fa-folder-open"></i></div>
                                            <p className="font-bold text-lg text-stone-500">Kayıt Bulunamadı</p>
                                            <p className="text-sm mt-1">Bu filtreye uygun herhangi bir izin kaydı yok.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LoginEkran = ({ onLogin }) => {
            const [kullanici, setKullanici] = useState('');
            const [sifre, setSifre] = useState('');
            const [hata, setHata] = useState('');

            const girisYap = (e) => {
                e.preventDefault();
                const KULLANICILAR = [
                    { k: 'esma.dogruel', s: 'IkPanel2026!*' }
                ];
                
                const gecerliKullanici = KULLANICILAR.find(u => u.k === kullanici && u.s === sifre);
                
                if (gecerliKullanici) {
                    onLogin();
                } else {
                    setHata('Kullanıcı adı veya şifre hatalı.');
                }
            };

            return (
                <div className="min-h-screen bg-stone-50 flex flex-col justify-center items-center p-4 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    <div className="absolute top-[20%] right-[-10%] w-96 h-96 bg-orange-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    <div className="absolute bottom-[-20%] left-[20%] w-96 h-96 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    
                    <div className="bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden border border-white/50 relative z-10">
                        <div className="bg-gradient-to-br from-rose-400 to-orange-400 p-10 text-center text-white relative">
                            <div className="w-20 h-20 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-5 text-4xl shadow-inner rotate-3 transform">
                                <i className="fas fa-leaf"></i>
                            </div>
                            <h2 className="text-3xl font-extrabold tracking-tight drop-shadow-md">İK Paneli</h2>
                            <p className="text-rose-50 text-sm mt-2 font-medium">İzin Yönetim Sistemi</p>
                        </div>
                        <div className="p-8 pb-10">
                            {hata && <div className="bg-red-50 text-red-600 text-sm p-4 rounded-xl mb-6 text-center font-bold border border-red-100 shadow-sm flex items-center justify-center gap-2"><i className="fas fa-exclamation-circle"></i> {hata}</div>}
                            <form onSubmit={girisYap} className="space-y-6">
                                <div>
                                    <label className="block text-xs font-extrabold text-stone-500 mb-2 tracking-wider ml-1">KULLANICI ADI</label>
                                    <div className="relative">
                                        <i className="fas fa-user absolute left-4 top-3.5 text-stone-400"></i>
                                        <input type="text" required value={kullanici} onChange={e => setKullanici(e.target.value)} className="w-full border-2 border-stone-100 rounded-xl pl-11 pr-4 py-3 text-sm focus:border-rose-400 focus:ring-0 outline-none transition-colors bg-stone-50/50 font-medium text-stone-800" placeholder="esma.dogruel" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-extrabold text-stone-500 mb-2 tracking-wider ml-1">ŞİFRE</label>
                                    <div className="relative">
                                        <i className="fas fa-lock absolute left-4 top-3.5 text-stone-400"></i>
                                        <input type="password" required value={sifre} onChange={e => setSifre(e.target.value)} className="w-full border-2 border-stone-100 rounded-xl pl-11 pr-4 py-3 text-sm focus:border-rose-400 focus:ring-0 outline-none transition-colors bg-stone-50/50 font-medium text-stone-800" placeholder="••••••••" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-stone-800 text-white font-extrabold text-sm py-4 rounded-xl hover:bg-stone-900 transition-all shadow-lg hover:shadow-xl mt-4 transform hover:-translate-y-1">Sisteme Giriş Yap</button>
                            </form>
                        </div>
                    </div>
                    <div className="mt-8 text-stone-400 text-sm font-medium text-center relative z-10 flex items-center justify-center gap-2">
                        <i className="fas fa-shield-heart text-rose-400"></i> Verileriniz güvenle şifrelenmektedir.
                    </div>
                </div>
            );
        };

        const MainApp = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [checkingAuth, setCheckingAuth] = useState(true);
            
            useEffect(() => {
                const logged = localStorage.getItem('ik_logged_in');
                if (logged === 'true') setIsLoggedIn(true);
                setCheckingAuth(false);
            }, []);

            const handleLogin = () => {
                localStorage.setItem('ik_logged_in', 'true');
                setIsLoggedIn(true);
            };

            const handleLogout = () => {
                localStorage.removeItem('ik_logged_in');
                setIsLoggedIn(false);
            };

            if (checkingAuth) return <div className="h-screen w-full bg-stone-50 flex items-center justify-center font-bold text-stone-400"><i className="fas fa-spinner fa-spin mr-2"></i> Yükleniyor...</div>;
            
            if (!isLoggedIn) {
                return <LoginEkran onLogin={handleLogin} />;
            }
            
            return <App onLogout={handleLogout} />;
        };

        ReactDOM.render(<MainApp />, document.getElementById('root'));
    </script>
</body>
</html>
